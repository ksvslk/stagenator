name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run --with ruff ruff check agent/

      - name: Unit tests (deterministic core)
        run: uv run pytest tests/unit -q

      - name: Import & graph build check
        env:
          DRY_RUN: "true"
        run: uv run python -c "from agent.agent import root_agent; assert root_agent.name == 'stagenator'; print('graph builds OK')"

      - name: Validate eval config
        run: uv run python -c "import yaml; yaml.safe_load(open('tests/eval/eval_config.yaml')); print('eval config valid')"
